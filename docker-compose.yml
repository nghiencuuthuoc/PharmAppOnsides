# OnSIDES full stack (pipeline + databases + annotator)
# Usage:
#   docker compose build pipeline
#   docker compose run --gpus all pipeline bash          # snakemake inside
#   docker compose up -d postgres mysql                  # DB only
#   docker compose --profile annotator up -d annotator   # API :8000
# Data dirs are bind-mounted (gitignored): _onsides, data, models, log, database output.

services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: onsides-pipeline:cu128
    container_name: onsides-pipeline
    working_dir: /work
    command: sleep infinity
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      JAVA_HOME: /usr/lib/jvm/java-11-openjdk-amd64
      TABULA_JAVA_PATH: /usr/lib/jvm/java-11-openjdk-amd64/bin/java
      HF_HUB_CACHE: /work/models/hf_cache
    volumes:
      - .:/work
    stdin_open: true
    tty: true

  annotator:
    image: onsides-pipeline:cu128
    container_name: onsides-annotator
    working_dir: /work
    command: python3.12 -m onsides.annotator.app
    ports:
      - "8000:8000"
    volumes:
      - .:/work
    depends_on:
      - pipeline
    profiles:
      - annotator

  postgres:
    image: postgres:16
    container_name: onsides-postgres
    environment:
      POSTGRES_USER: onsides
      POSTGRES_PASSWORD: onsides
      POSTGRES_DB: onsides
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # NOTE: schema is regenerated by the export step (database/schema/*.sql
    # committed copies are stale: native enums without CREATE TYPE).
    # Load the freshly exported postgres.sql with psql after export.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onsides -d onsides"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.4
    container_name: onsides-mysql
    environment:
      MYSQL_ROOT_PASSWORD: onsides-root
      MYSQL_USER: onsides
      MYSQL_PASSWORD: onsides
      MYSQL_DATABASE: onsides
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uonsides", "-ponsides"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SQLite needs no container: use database/onsides.db built by the
  # export step, or import CSVs with the sqlite3 CLI (see WINDOWS_SETUP.md).

volumes:
  pgdata:
  mysqldata:
